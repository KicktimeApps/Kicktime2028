# Automatische Prüfungen bei jedem Push und jedem Pull Request:
# Typen, Lint, Unit-Tests, Formatierung und Build – dieselben wie lokal
# (AGENTS.md, Abschnitt 4) – und Browser-Tests der wichtigsten Abläufe
# (e2e/, Server nachgestellt). Rot = nicht ausliefern, erst beheben.
# Runner fest auf Ubuntu 24.04: „ubuntu-latest“ ist inzwischen 26.04, dafür bringt
# Playwright 1.56.1 keinen Chromium mit (Browser-Tests schlugen schon beim Installieren fehl).
name: Prüfungen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefungen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Pakete installieren
        run: bun install --frozen-lockfile
      - name: Typen
        run: bunx tsc --noEmit -p .
      - name: Lint
        run: bunx eslint .
      - name: Unit-Tests
        run: bunx vitest run
      - name: Formatierung
        run: bunx prettier --check .
      - name: Build
        run: bunx vite build

  browser:
    name: Browser-Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Pakete installieren
        run: bun install --frozen-lockfile
      - name: Browser installieren
        run: bunx playwright install --with-deps chromium
      - name: Browser-Tests (Handy und Desktop)
        run: bunx playwright test
      - name: Bericht bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests-bericht
          path: |
            playwright-report/
            test-results/
          retention-days: 7
